name: Deploy FoldFeed site to GitHub Pages

# Publish the site whenever an issue (or the site code) lands on the default branch.
#
# Open daily-issue pull requests (branches claude/issue-<date>) are rendered too, as unlisted
# previews at /preview/<date>.html, listed at /preview/ with a link to each pull request, so the
# editor can check an issue on a phone before merging it. (The mention that announces a new pull
# request is in notify.yml, outside this workflow's queue.)
#
# pull_request_target runs this workflow's code from the default branch; from a pull request it
# only reads data/issues/<date>/ (JSON and SVG) and never runs code from the pull request.
on:
  push:
    branches: [claude/structural-biology-newsletter-arthsz]
    paths:
      - "data/issues/**"
      - "assets/**"
      - "pipeline/**"
      - ".github/workflows/pages.yml"
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Every run rebuilds the whole site from the default branch and the open pull requests, so a newer
# run makes an older one pointless: cancel it. (On 2026-10-12 a deploy sat "waiting" for nine hours
# and held up every run queued behind it.)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Previews only for branches of this repository, never for forks.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect unmerged issues from open pull requests (data only)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p preview
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$BASE" \
            --json number,headRefName,url --jq '.[] | [.number, .headRefName, .url] | @tsv' > prs.tsv
          while IFS=$'\t' read -r number branch url; do
            [[ "$branch" =~ ^claude/issue-([0-9]{4}-[0-9]{2}-[0-9]{2})(-[0-9]+)?$ ]] || continue
            [[ "$number" =~ ^[0-9]+$ ]] || continue
            date="${BASH_REMATCH[1]}"
            git fetch --quiet --depth=1 origin "refs/heads/$branch" || continue
            git archive FETCH_HEAD "data/issues/$date" | tar -x -C preview --strip-components=2 || continue
            printf '{"number": %s, "url": "https://github.com/%s/pull/%s"}\n' \
              "$number" "$GITHUB_REPOSITORY" "$number" > "preview/$date/pr.json"
          done < prs.tsv
          ls preview
      - name: Build site
        run: python3 -m pipeline.site --preview preview   # reads data/issues/*, assets/, writes site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on automatically on the first successful run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

